version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: astro-postgres
    environment:
      POSTGRES_DB: astro_catalog
      POSTGRES_USER: astro_user
      POSTGRES_PASSWORD: astro_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./application/catalog-service/src/main/resources/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro_user -d astro_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: astro-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: astro-localstack
    ports:
      - "4566:4566"  # LocalStack gateway (all AWS services)
      - "4510-4559:4510-4559"  # External service port range
    environment:
      SERVICES: s3,lambda,secretsmanager,cloudwatch
      DEBUG: 1
      DATA_DIR: /var/lib/localstack/data
      LAMBDA_EXECUTOR: docker-reuse
      DOCKER_HOST: unix:///var/run/docker.sock
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./terraform/lambda:/opt/lambda
      - ./scripts/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-postgres:
    image: postgres:15-alpine
    container_name: astro-airflow-postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.7.1
    container_name: astro-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: 'admin'
      _AIRFLOW_WWW_USER_PASSWORD: 'admin'
      AIRFLOW__CORE__FERNET_KEY: 'YlCImzjge_TeZc6jS6bQC_MZ3zCdSfDXP_d3wJHqE8s='
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins

  airflow-scheduler:
    image: apache/airflow:2.7.1
    container_name: astro-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__FERNET_KEY: 'YlCImzjge_TeZc6jS6bQC_MZ3zCdSfDXP_d3wJHqE8s='
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    command: airflow scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins

  airflow-webserver:
    image: apache/airflow:2.7.1
    container_name: astro-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__FERNET_KEY: 'YlCImzjge_TeZc6jS6bQC_MZ3zCdSfDXP_d3wJHqE8s='
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    ports:
      - "8080:8080"
    command: airflow webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins

  prometheus:
    image: prom/prometheus:latest
    container_name: astro-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: astro-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning

  image-processor:
    build:
      context: ./application
      dockerfile: ./image-processor/Dockerfile
    container_name: astro-image-processor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: jdbc:postgresql://postgres:5432/astro_catalog
      DATABASE_USERNAME: astro_user
      DATABASE_PASSWORD: astro_password

      # AWS LocalStack
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://localstack:4566

      # Spring Profile
      SPRING_PROFILES_ACTIVE: dev

      # Service Port
      SERVER_PORT: 8082

      # S3 Buckets
      S3_RAW_DATA_BUCKET: astro-raw-data
      S3_PROCESSED_DATA_BUCKET: astro-processed-data
      S3_INTERMEDIATE_DATA_BUCKET: astro-intermediate-data
      S3_ARCHIVE_BUCKET: astro-archive

      # JPA
      JPA_DDL_AUTO: update
      FLYWAY_ENABLED: false

      # Logging
      LOG_LEVEL_APP: INFO
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - default

  catalog-service:
    build:
      context: ./application
      dockerfile: ./catalog-service/Dockerfile
    container_name: astro-catalog-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: jdbc:postgresql://postgres:5432/astro_catalog
      DATABASE_USERNAME: astro_user
      DATABASE_PASSWORD: astro_password

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # AWS LocalStack
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://localstack:4566

      # Spring Profile
      SPRING_PROFILES_ACTIVE: dev

      # Service Port
      SERVER_PORT: 8081

      # JPA
      JPA_DDL_AUTO: update
      FLYWAY_ENABLED: false

      # Logging
      LOG_LEVEL_APP: INFO
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - default

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  airflow_postgres_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: astro-pipeline-network