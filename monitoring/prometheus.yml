global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]

  - job_name: 'image-processor'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'image-processor:8082' ]

  - job_name: 'catalog-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'catalog-service:8081' ]

  - job_name: 'postgres'
    static_configs:
      - targets: [ 'postgres:5432' ]

  - job_name: 'redis'
    static_configs:
      - targets: [ 'redis:6379' ]